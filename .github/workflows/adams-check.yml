name: Adams bridge checks

on:
  push:
    paths: ['mcp/adams/**', 'codex-skills/adams-evidence-mbd/**', '.github/workflows/adams-check.yml']
  pull_request:
    paths: ['mcp/adams/**', 'codex-skills/adams-evidence-mbd/**', '.github/workflows/adams-check.yml']

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ./mcp/adams
      - run: python -m unittest discover -s mcp/adams/tests -v
      - run: python mcp/adams/scripts/protocol_smoke.py
