name: bridge-offline-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hypermesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m pytest mcp/hypermesh/tests -q
  physical-ai:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e "./mcp/physical_ai_bridge[dev]"
      - run: python -m pytest tests -q
        working-directory: mcp/physical_ai_bridge
  robotstudio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e "./mcp/robotstudio[dev]"
      - run: python -m pytest tests -q
        working-directory: mcp/robotstudio
