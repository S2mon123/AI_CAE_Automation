[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "abb-physical-ai-mcp"
version = "0.4.0"
description = "Physical AI v4 development: read-only commissioning and offline cube tasks"
requires-python = ">=3.11"
dependencies = ["mcp==1.29.0", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
physical-ai-mcp = "physical_ai.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
