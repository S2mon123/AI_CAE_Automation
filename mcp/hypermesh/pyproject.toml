[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cae-hypermesh-mcp"
version = "0.7.0"
description = "HyperMesh-focused MCP entry point for AI CAE Automation Lab."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ai-cae-automation-lab>=0.2,<1.0",
    "mcp>=1.27,<2.0",
]

[project.scripts]
ai-cae-hypermesh-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "hypermesh_profile"]
